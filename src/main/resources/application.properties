# Nombre que Spring asigna a esta aplicacion.
spring.application.name=agenda-vet-api

# --- Conexión PostgreSQL
# Direccion JDBC: servidor local, puerto PostgreSQL y nombre de la base de datos.
spring.datasource.url=jdbc:postgresql://localhost:5432/db_agendavetapi
# Usuario de PostgreSQL usado por la aplicacion.
spring.datasource.username=postgres
# La contrasena se toma del entorno para no guardarla en el repositorio.
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
# Compara el esquema existente con las entidades, sin crear ni alterar tablas.
spring.jpa.hibernate.ddl-auto=validate
# Muestra las consultas SQL en la consola, util durante el desarrollo.
spring.jpa.show-sql=true
# Da formato legible a las consultas SQL impresas.
spring.jpa.properties.hibernate.format_sql=true
# Evita mantener abierta la sesion de base de datos durante el armado de la respuesta HTTP.
spring.jpa.open-in-view=false
